<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Eye</title>
  <style>
    body        { font-family: sans-serif; max-width: 620px; margin: 2em auto; padding: 0 1em; }
    h1          { font-size: 1.4em; }
    h2          { font-size: 1em; border-bottom: 1px solid #ddd; padding-bottom: .3em; }
    fieldset    { border: 1px solid #ddd; border-radius: 4px; padding: .8em; margin-bottom: 1em; }
    legend      { font-weight: bold; padding: 0 .4em; }
    label       { display: block; margin-bottom: .7em; font-size: .9em; }
    input, select { display: block; width: 100%; box-sizing: border-box;
                    padding: .35em; margin-top: .2em; border: 1px solid #bbb; border-radius: 3px; }
    button      { padding: .5em 1.4em; background: #0070f3; color: #fff;
                  border: none; border-radius: 4px; cursor: pointer; font-size: .95em; }
    button:hover { background: #005bb5; }
    #preview    { display: block; max-width: 100%; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1em; }
    #status-box { background: #f5f5f5; padding: .6em .8em; font-size: .82em;
                  border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>AI Eye</h1>

  <h2>Camera Preview</h2>
  <img id="preview" src="/photo" alt="camera view">

  <h2>Settings</h2>
  <form id="settings-form">
    <fieldset>
      <legend>WiFi</legend>
      <label>
        Network (SSID)
        <input id="ssid" name="ssid" type="text"
               placeholder="WiFi network name" autocomplete="off">
      </label>
      <label>
        Password
        <input name="password" type="password"
               placeholder="Leave blank to keep current" autocomplete="new-password">
      </label>
    </fieldset>

    <fieldset>
      <legend>Camera</legend>
      <label title="JPEG compression quality: higher value = better image, larger file">
        JPEG Quality (10–100)
        <input name="quality" type="number" min="10" max="100" value="90">
      </label>
      <label>
        Resolution
        <select name="framesize">
          <option value="13" selected>UXGA  1600×1200 (max)</option>
          <option value="12">SXGA  1280×1024</option>
          <option value="11">HD    1280×720</option>
          <option value="10">SVGA  800×600</option>
          <option value="8">VGA   640×480</option>
          <option value="6">QVGA  320×240</option>
        </select>
      </label>
    </fieldset>

    <button type="submit">Save &amp; Restart</button>
  </form>

  <h2>Device Status</h2>
  <div id="status-box">Loading…</div>

  <script>
    // Refresh camera preview every second via /photo endpoint
    const preview = document.getElementById('preview');
    setInterval(() => { preview.src = '/photo?t=' + Date.now(); }, 1000);

    // Poll /status for device info
    function fetchStatus() {
      fetch('/status')
        .then(r => r.json())
        .then(d => {
          document.getElementById('status-box').textContent =
            'WiFi: ' + (d.wifi || '—') +
            '  |  IP: '        + d.ip +
            '  |  Quality: '   + d.quality +
            '  |  Framesize: ' + d.framesize;
        })
        .catch(() => {
          document.getElementById('status-box').textContent = 'Device not reachable';
        });
    }
    fetchStatus();
    setInterval(fetchStatus, 5000);

    // POST settings form
    document.getElementById('settings-form').addEventListener('submit', e => {
      e.preventDefault();
      fetch('/settings', { method: 'POST', body: new FormData(e.target) })
        .then(r => r.text())
        .then(t => alert(t))
        .catch(() => alert('Error saving settings'));
    });
  </script>
</body>
</html>
