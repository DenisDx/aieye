; AI Eye – PlatformIO configuration.
; Board-specific GPIO assignments are defined as -D build flags so the same
; source tree compiles for every board target without #ifdef chains.
;
; Web assets (index.html, favicon.ico) are embedded in firmware as C arrays.
; Regenerate after editing:  python convert_html.py

[env]
framework    = arduino
monitor_speed = 115200
build_flags  =
    -std=gnu++17

; ─────────────────────────────────────────────────────────────────────────────
; ESP32S3-CAM N8R8 + OV3660
; https://emakefun.github.io/emakefun-docsify/#/zh-cn/esp32/esp32s3-cam/README_zh
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3cam_n8r8]
platform  = espressif32
board     = esp32-s3-devkitc-1

; 8 MB OPI PSRAM (R8 die), 8 MB flash (N8)
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 8MB
board_build.partitions          = huge_app.csv

upload_port = COM3
monitor_port = COM3

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Camera pins – OV3660 on ESP32S3-CAM N8R8 (verified from official docs)
    -DCAM_PIN_PWDN=-1
    -DCAM_PIN_RESET=-1
    -DCAM_PIN_XCLK=15
    -DCAM_PIN_SIOD=4
    -DCAM_PIN_SIOC=5
    -DCAM_PIN_D7=16
    -DCAM_PIN_D6=17
    -DCAM_PIN_D5=18
    -DCAM_PIN_D4=12
    -DCAM_PIN_D3=10
    -DCAM_PIN_D2=8
    -DCAM_PIN_D1=9
    -DCAM_PIN_D0=11
    -DCAM_PIN_VSYNC=6
    -DCAM_PIN_HREF=7
    -DCAM_PIN_PCLK=13
    ; TODO: verify LED flash GPIO from the board schematic (esp32s3_cam_sch.pdf)
    -DLED_FLASH_PIN=3
    ; BOOT button (GPIO0, active-low with internal pull-up)
    -DBUTTON_PIN=0

lib_deps =
    espressif/esp32-camera
    marian-craciunescu/ESP32Ping

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 CAM motherboard + OV3660
; SPEC board name: ESP32-S3-CAM
; Pin map source:
; examples/ESP32-S3_cam_OV3660/ESP32-S3_CameraWebServer/camera_pins.h
;   CAMERA_MODEL_ESP32S3_EYE
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32-s3-cam]
platform  = espressif32
board     = esp32-s3-devkitc-1

; 8 MB OPI PSRAM, 8 MB flash
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 8MB
board_build.partitions          = huge_app.csv

upload_port = COM5
monitor_port = COM5

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Camera pins – OV3660 (ESP32S3_EYE profile from vendor sketch)
    -DCAM_PIN_PWDN=-1
    -DCAM_PIN_RESET=-1
    -DCAM_PIN_XCLK=15
    -DCAM_PIN_SIOD=4
    -DCAM_PIN_SIOC=5
    -DCAM_PIN_D7=16
    -DCAM_PIN_D6=17
    -DCAM_PIN_D5=18
    -DCAM_PIN_D4=12
    -DCAM_PIN_D3=10
    -DCAM_PIN_D2=8
    -DCAM_PIN_D1=9
    -DCAM_PIN_D0=11
    -DCAM_PIN_VSYNC=6
    -DCAM_PIN_HREF=7
    -DCAM_PIN_PCLK=13
    ; Flash LED and BOOT button
    -DLED_FLASH_PIN=3
    -DBUTTON_PIN=0
    ; On-board WS2812 RGB LED data pin
    -DRGB_LED_PIN=48

lib_deps =
    espressif/esp32-camera
    marian-craciunescu/ESP32Ping
